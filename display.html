<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>Pantalla Bienvenida</title>
<script src="config.js"></script>
<style>
:root{color-scheme:dark;font-family:Arial;background:#020617;color:#f8fafc} body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;overflow:hidden}
.screen{width:100%;padding:40px;display:grid;place-items:center} .card{width:min(1200px,calc(100% - 80px));min-height:560px;padding:48px;border-radius:36px;background:rgba(10,14,31,0.88);position:relative}
.welcome-card{margin-top:32px;padding:42px;border-radius:30px;background:rgba(15,23,42,0.95);border:1px solid rgba(14,165,233,0.18)} .welcome-text h2{font-size:clamp(2.8rem,5.5vw,5.6rem);margin:0;color:#7dd3fc} .waiting-state{text-align:center} .confetti{position:absolute;width:12px;height:12px;border-radius:4px}
.voice-btn{position:absolute;top:24px;right:24px;border:none;border-radius:999px;padding:12px 20px;background:rgba(255,255,255,0.08);color:#e2e8f0;cursor:pointer} .voice-btn.active{background:#38bdf8;color:#020617}
.overlay{position:absolute;inset:0;background:rgba(2,6,23,0.92);display:grid;place-items:center;z-index:20;border-radius:36px} .overlay button{font-size:1.4rem;padding:22px 36px;border-radius:20px;border:none;background:#38bdf8;color:#020617;font-weight:900;cursor:pointer}
.queue{position:absolute;bottom:24px;left:50%;transform:translateX(-50%);background:rgba(56,189,248,0.15);padding:8px 16px;border-radius:999px;display:none}
</style>
</head>
<body>
<div class="screen"><div class="card">
<button id="voiceToggle" class="voice-btn">🔇</button>
<div id="voiceOverlay" class="overlay"><div style="text-align:center"><h2>🔊 Activar voz</h2><button id="enableVoice">Activar</button></div></div>
<div id="waitingState" class="waiting-state"><h3>Esperando invitados...</h3><p id="apiStatus">Conectado</p></div>
<div id="welcomeCard" class="welcome-card" style="display:none"><h2 id="welcomeTitle"></h2><p id="welcomeSubtitle"></p><p id="welcomeEvent" style="color:#a78bfa"></p><p id="welcomeMsg"></p></div>
<div id="queueBadge" class="queue"></div>
</div></div>
<script>
let isShowing=false, localQueue=[], voiceEnabled=localStorage.getItem('feria_voice_enabled')==='true', audioCtx=null;
const welcomeCard=document.getElementById('welcomeCard'), waitingState=document.getElementById('waitingState'), welcomeTitle=document.getElementById('welcomeTitle'), welcomeSubtitle=document.getElementById('welcomeSubtitle'), welcomeEvent=document.getElementById('welcomeEvent'), welcomeMsg=document.getElementById('welcomeMsg'), apiStatus=document.getElementById('apiStatus'), voiceToggle=document.getElementById('voiceToggle'), voiceOverlay=document.getElementById('voiceOverlay'), queueBadge=document.getElementById('queueBadge');
function initAudio(){try{audioCtx=new (window.AudioContext||window.webkitAudioContext)(); if(audioCtx.state==='suspended') audioCtx.resume();}catch(e){} window.speechSynthesis.getVoices();}
function updateVoiceUI(){if(voiceEnabled){voiceToggle.textContent='🔊'; voiceToggle.classList.add('active'); voiceOverlay.style.display='none';}else{voiceToggle.textContent='🔇'; voiceToggle.classList.remove('active');}}
function enableVoice(){voiceEnabled=true; localStorage.setItem('feria_voice_enabled','true'); initAudio(); updateVoiceUI(); const t=new SpeechSynthesisUtterance('Voz activada'); t.lang='es-PE'; window.speechSynthesis.speak(t);}
function getVoice(){const v=window.speechSynthesis.getVoices(); return v.find(x=>x.lang==='es-PE')||v.find(x=>x.lang.startsWith('es-'))||v[0];}
async function fetchLatest(){try{const r=await fetch(`${API_BASE}?action=latest&t=${Date.now()}`,{cache:'no-store'}); const d=await r.json(); if(d && d.status==='INGRESADO'){ if(isShowing){localQueue.push(d); updateBadge();} else showWelcome(d);}}catch(e){}}
function updateBadge(){if(localQueue.length>0){queueBadge.style.display='block'; queueBadge.textContent='🎉 '+localQueue.length+' en espera';}else queueBadge.style.display='none';}
function showWelcome(data){isShowing=true; waitingState.style.display='none'; welcomeCard.style.display='block'; welcomeTitle.textContent='¡BIENVENIDO! '+data.nombres+' '+data.apellidos; welcomeSubtitle.textContent=data.parentesco+' de '+data.estudiante; welcomeEvent.textContent=data.eventoNombre||''; welcomeMsg.textContent='Gracias por acompañarnos'; for(let k=0;k<3;k++) setTimeout(()=>{for(let i=0;i<30;i++){const c=document.createElement('div'); c.className='confetti'; c.style.left=Math.random()*90+'%'; c.style.top='10%'; c.style.background='#38bdf8'; document.body.appendChild(c); c.animate([{transform:'translateY(0)',opacity:1},{transform:'translateY(400px)',opacity:0}],{duration:2500,fill:'forwards'}); setTimeout(()=>c.remove(),3000);}},k*300); let voiceDone=!voiceEnabled, minDone=false; function finish(){if(voiceDone&&minDone){welcomeCard.style.display='none'; if(localQueue.length>0){const n=localQueue.shift(); updateBadge(); setTimeout(()=>showWelcome(n),1000);} else{waitingState.style.display='block'; isShowing=false;}}} if(voiceEnabled){ const frase=`¡Bienvenido! ${data.nombres} ${data.apellidos}. ${data.parentesco} de ${data.estudiante}. Gracias por acompañarnos en ${data.eventoNombre||'nuestro evento'}.`; const u=new SpeechSynthesisUtterance(frase); u.lang='es-PE'; u.rate=0.9; const v=getVoice(); if(v) u.voice=v; u.onend=()=>{voiceDone=true; setTimeout(finish,1500);}; window.speechSynthesis.speak(u);} else voiceDone=true; setTimeout(()=>{minDone=true; finish();},10000); setTimeout(()=>{window.speechSynthesis.cancel(); voiceDone=true; minDone=true; finish();},22000); }
document.getElementById('enableVoice').addEventListener('click', enableVoice); voiceToggle.addEventListener('click', ()=>{if(!voiceEnabled) enableVoice(); else{voiceEnabled=false; localStorage.removeItem('feria_voice_enabled'); updateVoiceUI();}});
if(voiceEnabled){initAudio(); updateVoiceUI();} else voiceOverlay.style.display='grid';
setInterval(fetchLatest,1200);
window.addEventListener('load', ()=>{fetchLatest(); initAudio();});
</script>
</body>
</html>

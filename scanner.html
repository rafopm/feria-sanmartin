<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
<title>Escáner</title>
<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<script src="config.js"></script>
<style>
:root{color-scheme:dark;font-family:Arial;background:#020617;color:#f8fafc} body{margin:0;min-height:100vh;display:flex;justify-content:center;padding:16px}
.page{width:min(100%,700px);display:grid;gap:18px;background:rgba(12,18,38,0.92);border-radius:28px;padding:24px}
#reader{width:100%;min-height:50vh;border-radius:24px;background:#07101f} #reader video{width:100%!important;object-fit:cover}
.status{padding:20px;border-radius:18px;font-weight:700} .success{background:#a7f3d0;color:#0f172a} .error{background:#dc2626} .warning{background:#f59e0b} .pending{background:#38bdf8;color:#020617}
button{border:none;border-radius:16px;padding:16px;font-weight:800;cursor:pointer} .primary{background:#38bdf8;color:#020617;width:100%} .secondary{background:rgba(255,255,255,0.08);color:#e2e8f0}
</style>
</head>
<body>
<main class="page">
<h1>Escáner Ingreso</h1>
<div id="eventTag"></div>
<div id="reader"></div>
<button id="startBtn" class="primary">📷 Activar cámara</button>
<div id="message" class="status pending">Toca para iniciar</div>
<button id="nextBtn" class="primary" style="display:none">➡️ Siguiente</button>
<button id="switchBtn" class="secondary" style="display:none">Cambiar cámara</button>
</main>
<script>
let html5QrCode=null, currentFacing="environment", scanning=false, lastId=null, lastTime=0;
const msg=document.getElementById('message'), startBtn=document.getElementById('startBtn'), nextBtn=document.getElementById('nextBtn'), switchBtn=document.getElementById('switchBtn');
function update(t,c){msg.textContent=t; msg.className='status '+c;}
async function loadEvent(){try{const r=await fetch(`${API_BASE}?action=getEvents`); const j=await r.json(); document.getElementById('eventTag').textContent=j.events?.[0]?.nombre||'No hay evento activo';}catch(e){}}
async function startScanner(){if(scanning) return; update('Solicitando...','pending'); try{if(html5QrCode){try{await html5QrCode.stop(); html5QrCode.clear();}catch(e){}} html5QrCode=new Html5Qrcode('reader'); await html5QrCode.start({facingMode:currentFacing},{fps:15,qrbox:{width:280,height:280}}, onScan); scanning=true; startBtn.style.display='none'; switchBtn.style.display='block'; update('Activa - llegada desordenada OK','pending');}catch(err){update('Error: '+err.message,'error');}}
async function onScan(decoded){const now=Date.now(), id=decoded.trim(); if(id===lastId && now-lastTime<5000) return; lastId=id; lastTime=now; try{await html5QrCode.pause();}catch(e){} scanning=false; update('Verificando '+id+'...','pending'); try{const r=await fetch(`${API_BASE}?action=check&id=${encodeURIComponent(id)}&t=${now}`); const res=await r.json(); if(res.status==='OK') update('✅ '+res.data.nombres+' '+res.data.apellidos+' - '+res.data.eventoNombre,'success'); else if(res.status==='DUPLICADO') update('⚠️ YA INGRESÓ','warning'); else if(res.status==='EVENTO_INACTIVO') update('🚫 Evento inactivo','error'); else update('🚫 NO VÁLIDO','error');}catch(e){update('Error conexión','error');} nextBtn.style.display='block';}
function resume(){nextBtn.style.display='none'; if(html5QrCode){try{html5QrCode.resume(); scanning=true; update('Listo','pending');}catch(e){startScanner();}}}
startBtn.addEventListener('click', startScanner); nextBtn.addEventListener('click', resume); switchBtn.addEventListener('click', async()=>{currentFacing=currentFacing==='environment'?'user':'environment'; scanning=false; await startScanner();});
window.addEventListener('load', loadEvent);
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no" />
<title>Escáner - Feria San Martín</title>
<style>
:root{color-scheme:dark;font-family:'Segoe UI',Arial,sans-serif;background:#020617;color:#f8fafc}
*{box-sizing:border-box} body{margin:0;min-height:100vh;display:flex;justify-content:center;padding:16px;background:radial-gradient(circle at top, rgba(56,189,248,0.14), transparent 28%),linear-gradient(180deg,#020617 0%,#070b1b 100%)}
.page{width:min(100%,700px);display:grid;gap:18px;background:rgba(12,18,38,0.92);border:1px solid rgba(255,255,255,0.08);border-radius:28px;padding:24px}
#reader{width:100%;min-height:48vh;border-radius:24px;overflow:hidden;background:#07101f;border:1px solid rgba(148,163,184,0.18);position:relative}
#reader video{width:100%!important;height:100%!important;object-fit:cover}
.status-text{padding:18px 20px;border-radius:18px;font-weight:700} .success{color:#0f172a;background:#a7f3d0} .error{color:#fff;background:#dc2626} .pending{color:#fff;background:linear-gradient(135deg,#38bdf8,#0ea5e9)}
button{border:none;border-radius:16px;padding:16px 22px;font-weight:800;cursor:pointer;font-size:1rem} .primary{background:linear-gradient(135deg,#38bdf8,#0ea5e9);color:#020617;width:100%} .secondary{background:rgba(255,255,255,0.08);color:#e2e8f0}
#debug{font-size:0.8rem;color:#94a3b8;white-space:pre-wrap;word-break:break-all}
</style>
<!-- CDN CORRECTO -->
<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
</head>
<body>
<main class="page">
<h1 style="margin:0">Escáner de Ingreso</h1>
<p style="color:#94a3b8;margin:0">GitHub Pages → Google Sheets - Colegio San Martín</p>

<div id="reader"></div>

<button id="startBtn" class="primary">📷 Tocar para activar cámara</button>

<div id="message" class="status-text pending">Esperando... Verifica que el CDN cargó.</div>
<div id="debug"></div>

<div style="display:flex;gap:12px"><button id="switchBtn" class="secondary" style="display:none">🔄 Cambiar cámara</button><button id="restart" class="secondary">Reiniciar</button></div>
</main>

<script>
const API_BASE = "https://script.google.com/macros/s/AKfycbyNv8GsbBGB-w45ZkPIoV2Erwx9VATaQNy7Uz4kKLHyIjP3ig9arOdrT6NixI4auIv8Cg/exec";
let html5QrCode = null;
let currentFacing = "environment";
let scanning = false;
const msgEl = document.getElementById('message');
const debugEl = document.getElementById('debug');
const startBtn = document.getElementById('startBtn');
const switchBtn = document.getElementById('switchBtn');

function log(t){ debugEl.textContent += "\n" + t; }
function updateStatus(t,c){ msgEl.textContent=t; msgEl.className='status-text '+c; }

function isLibLoaded(){
  const ok = typeof Html5Qrcode !== 'undefined';
  if(!ok){ 
    updateStatus('Librería no cargó. Revisa tu internet o bloqueador.','error');
    log('Html5Qrcode no definido. Intentando CDN fallback jsdelivr...');
    // fallback dinamico
    const s = document.createElement('script');
    s.src = 'https://cdn.jsdelivr.net/npm/html5-qrcode@2.3.8/html5-qrcode.min.js';
    s.onload = ()=>{ log('Fallback CDN cargado OK'); updateStatus('Librería cargada. Toca para activar cámara','pending'); };
    s.onerror = ()=>{ log('Fallback también falló'); };
    document.head.appendChild(s);
  }
  return ok;
}

async function startScanner(){
  if(!isLibLoaded()) return;
  if(scanning) return;
  updateStatus('Solicitando permiso de cámara...','pending');
  try{
    if(html5QrCode){ try{ await html5QrCode.stop(); html5QrCode.clear(); }catch(e){} }
    html5QrCode = new Html5Qrcode('reader');
    const config = { fps:15, qrbox:{width:260,height:260} };
    log('Iniciando con facingMode: '+currentFacing);
    await html5QrCode.start({facingMode: currentFacing}, config, onScanSuccess, ()=>{});
    scanning=true;
    startBtn.style.display='none';
    switchBtn.style.display='inline-block';
    updateStatus('Cámara activa. Apunta al QR','pending');
    setTimeout(()=>{ document.querySelectorAll('#reader video').forEach(v=>{ v.setAttribute('playsinline','true'); v.muted=true; }); }, 500);
  }catch(err){
    console.error(err); log('ERROR: '+err.name+' - '+err.message);
    if(err.name==='NotAllowedError'){ updateStatus('Permiso denegado. Permite cámara en el candadito del navegador.','error'); }
    else if(currentFacing==='environment'){
      log('Reintentando con cámara frontal...');
      currentFacing='user'; scanning=false;
      setTimeout(startScanner, 500);
    }else{
      updateStatus('No se pudo iniciar: '+err.name+' '+err.message,'error');
    }
  }
}

async function onScanSuccess(decoded){
  updateStatus('QR: '+decoded+' - Verificando en Sheets...','pending');
  try{ await html5QrCode.pause(); }catch(e){}
  try{
    const r = await fetch(`${API_BASE}?action=check&id=${encodeURIComponent(decoded.trim())}&t=${Date.now()}`);
    const res = await r.json();
    log('Respuesta Sheets: '+JSON.stringify(res));
    if(res.status==='OK'){ updateStatus('✅ INGRESO: '+res.data.nombres+' '+res.data.apellidos,'success'); }
    else if(res.status==='DUPLICADO'){ updateStatus('⚠️ YA USADO','error'); }
    else{ updateStatus('🚫 NO VÁLIDO','error'); }
  }catch(e){ log('Fetch error: '+e.message); updateStatus('Error conexión Sheets: '+e.message,'error'); }
  setTimeout(()=>{ try{ html5QrCode.resume(); updateStatus('Listo para siguiente QR','pending'); }catch(e){} }, 2500);
}

startBtn.addEventListener('click', startScanner);
document.getElementById('restart').addEventListener('click', async ()=>{ try{ await html5QrCode.stop(); html5QrCode.clear(); }catch(e){}; scanning=false; currentFacing='environment'; startBtn.style.display='block'; updateStatus('Reiniciado. Toca para activar','pending'); });
switchBtn.addEventListener('click', async ()=>{ currentFacing = currentFacing==='environment'?'user':'environment'; scanning=false; await startScanner(); });

window.addEventListener('load', ()=>{ setTimeout(()=>{ if(typeof Html5Qrcode==='undefined'){ updateStatus('No cargó librería html5-qrcode. Revisa internet/adblocker','error'); log('Html5Qrcode undefined al cargar'); } else{ updateStatus('Librería OK. Toca para activar cámara','pending'); } }, 800); });
</script>
</body>
</html>

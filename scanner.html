<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
<title>Ingreso - Escáner</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<script src="config.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@600;800&display=swap" rel="stylesheet">
<style>body{font-family:'Plus Jakarta Sans',sans-serif} #reader video{object-fit:cover}</style>
</head>
<body class="min-h-screen bg-[#020617] text-white flex items-center justify-center p-4">
  <div class="fixed inset-0 bg-[radial-gradient(circle_at_30%_20%,rgba(56,189,248,0.1),transparent_30%)] pointer-events-none"></div>
  <div class="relative w-full max-w-[680px] bg-white/[0.05] border border-white/10 rounded-[32px] p-6 backdrop-blur-xl">
    <div class="flex justify-between items-center">
      <div>
        <h1 class="text-2xl font-extrabold">Control de ingreso</h1>
        <p class="text-white/50 text-sm mt-1">Escanea el código QR de la entrada</p>
      </div>
      <div id="eventTag" class="bg-white/10 px-3 py-1.5 rounded-full text-xs font-bold text-white/70">Conectando...</div>
    </div>
    <div class="mt-6 rounded-[24px] overflow-hidden bg-black border border-white/10 aspect-[4/3]">
      <div id="reader" class="w-full h-full"></div>
    </div>
    <button id="startBtn" class="mt-6 w-full bg-white text-slate-900 font-extrabold py-4 rounded-2xl">Activar cámara</button>
    <div id="message" class="mt-4 p-4 rounded-2xl bg-white/[0.06] border border-white/10 text-sm text-center">Toca "Activar cámara" para comenzar</div>
    <div class="mt-4 grid grid-cols-2 gap-3">
      <button id="nextBtn" class="hidden bg-white text-slate-900 font-extrabold py-4 rounded-2xl">Escanear otro</button>
      <button id="switchBtn" class="hidden bg-white/10 border border-white/10 text-white/70 py-4 rounded-2xl">Cambiar cámara</button>
    </div>
  </div>
<script>
let html5QrCode=null, currentFacing="environment", scanning=false, lastId=null, lastTime=0;
const msg=document.getElementById('message'), startBtn=document.getElementById('startBtn'), nextBtn=document.getElementById('nextBtn'), switchBtn=document.getElementById('switchBtn');
function update(t,type){{
  let cls="mt-4 p-4 rounded-2xl text-sm font-bold text-center border ";
  if(type==='success') cls+="bg-emerald-500 text-slate-900 border-emerald-400";
  else if(type==='error') cls+="bg-red-500/90 text-white border-red-400";
  else if(type==='warning') cls+="bg-amber-400 text-slate-900 border-amber-300";
  else cls+="bg-white/[0.06] border-white/10 text-white/80";
  msg.className=cls; msg.textContent=t;
}}
async function loadEvent(){{
  try{{ const r=await fetch(`${{API_BASE}}?action=getEvents&t=${{Date.now()}}`); const j=await r.json(); document.getElementById('eventTag').textContent=j.events?.[0]?.nombre||'Sin evento'; }}catch(e){{ document.getElementById('eventTag').textContent='Sin conexión'; }}
}}
async function startScanner(){{
  if(scanning) return; update('Solicitando acceso a la cámara...','');
  try{{ if(html5QrCode){{try{{await html5QrCode.stop(); html5QrCode.clear();}}catch(e){{}}}} html5QrCode=new Html5Qrcode('reader'); await html5QrCode.start({{facingMode:currentFacing}},{{fps:15,qrbox:{{width:280,height:280}}}}, onScan); scanning=true; startBtn.style.display='none'; switchBtn.style.display='block'; update('Apunta la cámara al código QR',''); }}catch(err){{ update('No pudimos acceder a la cámara. Verifica los permisos.','error'); }}
}}
async function onScan(decoded){{
  const now=Date.now(), id=decoded.trim(); if(id===lastId && now-lastTime<5000) return; lastId=id; lastTime=now;
  try{{await html5QrCode.pause();}}catch(e){{}} scanning=false; update('Verificando entrada...','');
  try{{
    const r=await fetch(`${{API_BASE}}?action=check&id=${{encodeURIComponent(id)}}&t=${{now}}`);
    const res=await r.json();
    if(res.status==='OK') update('¡Bienvenido! '+res.data.nombres+' '+res.data.apellidos+' - '+res.data.eventoNombre,'success');
    else if(res.status==='DUPLICADO') update('Esta entrada ya fue usada a las '+(res.data.horaIngreso||''),'warning');
    else if(res.status==='EVENTO_INACTIVO') update('Este evento ya no está disponible','error');
    else update('Entrada no válida','error');
  }}catch(e){{ update('No hay conexión, intenta de nuevo','error'); }}
  nextBtn.style.display='block';
}}
function resume(){{ nextBtn.style.display='none'; if(html5QrCode){{try{{html5QrCode.resume(); scanning=true; update('Listo para escanear','');}}catch(e){{startScanner();}}}} }}
startBtn.addEventListener('click', startScanner); nextBtn.addEventListener('click', resume); switchBtn.addEventListener('click', async()=>{{currentFacing=currentFacing==='environment'?'user':'environment'; scanning=false; await startScanner();}});
window.addEventListener('load', loadEvent);
</script>
</body>
</html>

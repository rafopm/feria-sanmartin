<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no" />
<title>Escáner - Feria San Martín</title>
<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<style>
:root{color-scheme:dark;font-family:'Segoe UI',Arial,sans-serif;background:#020617;color:#f8fafc}
*{box-sizing:border-box} body{margin:0;min-height:100vh;display:flex;justify-content:center;padding:16px;background:radial-gradient(circle at top, rgba(56,189,248,0.14), transparent 28%),linear-gradient(180deg,#020617 0%,#070b1b 100%)}
.page{width:min(100%,700px);display:grid;gap:18px;background:rgba(12,18,38,0.92);border:1px solid rgba(255,255,255,0.08);border-radius:28px;padding:24px}
#reader{width:100%;min-height:50vh;border-radius:24px;overflow:hidden;background:#07101f;border:1px solid rgba(148,163,184,0.18)}
#reader video{width:100%!important;height:100%!important;object-fit:cover}
.status-text{padding:20px 22px;border-radius:18px;font-weight:700;font-size:1.05rem;line-height:1.4} .success{color:#0f172a;background:#a7f3d0} .error{color:#fff;background:#dc2626} .warning{color:#fff;background:#f59e0b} .pending{color:#fff;background:linear-gradient(135deg,#38bdf8,#0ea5e9)}
button{border:none;border-radius:16px;padding:16px 22px;font-weight:800;cursor:pointer;font-size:1rem} .primary{background:linear-gradient(135deg,#38bdf8,#0ea5e9);color:#020617;width:100%} .secondary{background:rgba(255,255,255,0.08);color:#e2e8f0}
.next-btn{display:none;margin-top:12px;background:#fff;color:#020617}
</style>
</head>
<body>
<main class="page">
<h1 style="margin:0">Escáner de Ingreso</h1>
<p style="color:#94a3b8;margin:0">Colegio San Martín - Feria Tecnológica</p>
<div id="reader"></div>
<button id="startBtn" class="primary">📷 Tocar para activar cámara</button>
<div id="message" class="status-text pending">Toca el botón para iniciar</div>
<button id="nextBtn" class="primary next-btn">➡️ Escanear siguiente invitado</button>
<div style="display:flex;gap:12px;margin-top:8px"><button id="switchBtn" class="secondary" style="display:none">🔄 Cambiar cámara</button></div>
</main>
<script>
const API_BASE = "https://script.google.com/macros/s/AKfycbyZVvLjIQIc94s6j_tgsaDxASojzZPj0OvtT_Wyi9Y00hzRcRFcJtXAdQxKIgkeKsm6lw/exec";
let html5QrCode=null; let currentFacing="environment"; let scanning=false;
let lastScannedId=null; let lastScannedTime=0;
const msgEl=document.getElementById('message');
const startBtn=document.getElementById('startBtn');
const nextBtn=document.getElementById('nextBtn');
const switchBtn=document.getElementById('switchBtn');

function updateStatus(t,c){ msgEl.textContent=t; msgEl.className='status-text '+c; }

async function startScanner(){
  if(scanning) return;
  updateStatus('Solicitando cámara...','pending');
  try{
    if(html5QrCode){ try{ await html5QrCode.stop(); html5QrCode.clear(); }catch(e){} }
    html5QrCode = new Html5Qrcode('reader');
    await html5QrCode.start({facingMode: currentFacing}, {fps:15, qrbox:{width:280,height:280}}, onScanSuccess);
    scanning=true; startBtn.style.display='none'; switchBtn.style.display='inline-block'; nextBtn.style.display='none';
    updateStatus('Cámara activa. Apunta al QR','pending');
    setTimeout(()=>{ document.querySelectorAll('#reader video').forEach(v=>{ v.setAttribute('playsinline','true'); v.muted=true; }); }, 300);
  }catch(err){
    if(err.name==='NotAllowedError'){ updateStatus('Permiso denegado. Activa la cámara en el candado del navegador.','error'); }
    else if(currentFacing==='environment'){ currentFacing='user'; scanning=false; setTimeout(startScanner,400); }
    else{ updateStatus('Error cámara: '+err.message,'error'); }
  }
}

async function onScanSuccess(decoded){
  const now = Date.now();
  const id = decoded.trim();
  // Evita escanear el mismo QR 10 veces seguidas
  if(id===lastScannedId && (now-lastScannedTime)<5000) return;
  lastScannedId=id; lastScannedTime=now;

  try{ await html5QrCode.pause(); }catch(e){}
  scanning=false;
  updateStatus('Verificando '+id+' en Sheets...','pending');
  try{
    const r = await fetch(`${API_BASE}?action=check&id=${encodeURIComponent(id)}&t=${now}`);
    const res = await r.json();
    if(res.status==='OK'){
      updateStatus('✅ BIENVENIDO: '+res.data.nombres+' '+res.data.apellidos+'\n'+res.data.parentesco+' de '+res.data.estudiante,'success');
    }else if(res.status==='DUPLICADO'){
      // Muestra quien es, no solo "ya usado"
      const d = res.data||{};
      updateStatus('⚠️ YA INGRESÓ: '+(d.nombres||'')+' '+(d.apellidos||'')+' - '+ (d.estudiante||'')+' ('+(d.horaIngreso||'')+')','warning');
    }else{
      updateStatus('🚫 INVITACIÓN NO VÁLIDA','error');
    }
  }catch(e){ updateStatus('Error conexión Sheets','error'); }
  nextBtn.style.display='block'; // solo continúa cuando tocan
}

function resumeNext(){
  nextBtn.style.display='none';
  if(html5QrCode){ try{ html5QrCode.resume(); scanning=true; updateStatus('Listo para siguiente QR','pending'); }catch(e){ startScanner(); } }
  else{ startScanner(); }
}

startBtn.addEventListener('click', startScanner);
nextBtn.addEventListener('click', resumeNext);
switchBtn.addEventListener('click', async ()=>{ currentFacing=currentFacing==='environment'?'user':'environment'; scanning=false; await startScanner(); });
</script>
</body>
</html>
